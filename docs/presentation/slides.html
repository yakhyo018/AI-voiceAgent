  slides.html?lang=ko | en | uz  →  build.sh 가 Chrome headless 로 PDF 생성
  (발표자용 6쪽 + 공유용 5쪽 _share, ?notes=0)
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AI 보훈이 — 발표</title>
<style>
  @page { size: 1280px 720px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {
    font-family: "Apple SD Gothic Neo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #14233a; word-break: keep-all; overflow-wrap: break-word;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  :root {
    --navy: #10294a; --ink: #14233a; --muted: #5d6b80; --line: #e3e8ef;
    --teal: #0f8a7a; --teal-bg: #e7f5f2; --red: #d24b4b; --red-bg: #fdecec;
    --amber: #b7860b; --amber-bg: #fdf5e0; --blue-bg: #eef3fb; --soft: #f6f8fb;
  }
  .slide {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
    padding: 56px 72px 48px; page-break-after: always; break-after: page;
    display: flex; flex-direction: column;
  }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;
    font-size: 15px; color: var(--muted); letter-spacing: .02em; }
  .top .tag { color: var(--teal); font-weight: 700; }
  h1 { font-size: 40px; line-height: 1.2; color: var(--navy); letter-spacing: -.01em; }
  h2 { font-size: 34px; line-height: 1.25; color: var(--navy); letter-spacing: -.01em; margin-bottom: 8px; }
  .lead { font-size: 19px; color: var(--muted); margin-bottom: 26px; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 24px; display: flex; justify-content: space-between;
    font-size: 13px; color: #9aa5b5; }

  /* 1. title */
  .cover { background: linear-gradient(135deg, #10294a 0%, #173a63 60%, #0f6f68 100%); color: #fff; padding: 72px 80px; }
  .cover .kicker { font-size: 18px; color: #9fe3d6; font-weight: 600; margin-bottom: 22px; }
  .cover h1 { color: #fff; font-size: 54px; margin-bottom: 18px; }
  .cover .sub { font-size: 22px; color: #d6e2f0; margin-bottom: 54px; }
  .stats { display: flex; gap: 22px; }
  .stat { flex: 1; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 22px 26px; }
  .stat b { display: block; font-size: 40px; color: #fff; margin-bottom: 6px; }
  .stat span { font-size: 17px; color: #d6e2f0; }
  .cover .hook { margin-top: auto; font-size: 21px; color: #fff; border-left: 4px solid #5fd3bf; padding-left: 18px; line-height: 1.45; }
  .cover .foot { color: #9fb3cc; }

  /* 2. pipeline */
  .pipe { display: flex; align-items: stretch; gap: 0; margin-bottom: 22px; }
  .step { flex: 1; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px 14px; position: relative; }
  .step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 15px; margin-bottom: 10px; }
  .step .t { font-size: 19px; font-weight: 700; color: var(--navy); margin-bottom: 6px; line-height: 1.25; }
  .step .d { font-size: 15.5px; color: var(--muted); line-height: 1.45; }
  .step.safe { background: var(--red-bg); border-color: #f3c9c9; } .step.safe .n { background: var(--red); }
  .step.llm { background: var(--teal-bg); border-color: #bfe5dd; } .step.llm .n { background: var(--teal); }
  .arrow { width: 22px; display: flex; align-items: center; justify-content: center; color: #9aa5b5; font-size: 20px; flex: 0 0 22px; }
  .example { background: #fff; border: 1px dashed #c7d0dc; border-radius: 14px; padding: 18px 24px; font-size: 18px; line-height: 1.7; margin-bottom: 20px; }
  .example .q { font-weight: 700; color: var(--navy); }
  .example code { background: var(--blue-bg); border-radius: 6px; padding: 1px 7px; font-size: 15px; font-family: Menlo, monospace; color: #1d4a8a; }
  .timeline { display: flex; height: 50px; border-radius: 10px; overflow: hidden; font-size: 14.5px; font-weight: 600; color: #fff; }
  .timeline div { display: flex; align-items: center; justify-content: center; padding: 0 10px; white-space: nowrap; }
  .note { margin-top: 14px; font-size: 16.5px; color: var(--muted); }

  /* 3. architecture */
  .arch { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 22px; align-items: stretch; margin-bottom: 22px; }
  .box { border-radius: 16px; padding: 22px 24px; border: 1px solid var(--line); background: var(--soft); }
  .box h3 { font-size: 22px; color: var(--navy); margin-bottom: 12px; }
  .box ul { list-style: none; } .box li { font-size: 18px; line-height: 1.6; padding-left: 18px; position: relative; margin-bottom: 4px; }
  .box li::before { content: "•"; position: absolute; left: 2px; color: var(--teal); font-weight: 700; }
  .box.llm { background: var(--teal-bg); border-color: #bfe5dd; }
  .box.srv { background: var(--blue-bg); border-color: #cfdcf0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #fff; border: 1px solid #d5dde8; border-radius: 999px; padding: 7px 14px; font-size: 16.5px; font-weight: 600; color: var(--navy); }
  .chip.r { border-color: #f0b9b9; color: var(--red); }
  .guard { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; font-size: 18.5px; line-height: 1.6; }
  .guard .x { color: var(--red); font-weight: 700; } .guard .ok { color: var(--teal); font-weight: 700; }
  .db { margin-top: 18px; font-size: 17.5px; line-height: 1.5; color: var(--muted); }
  .db b { color: var(--navy); }

  /* 4. problems */
  table.ps { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  table.ps th { text-align: left; font-size: 16px; color: var(--muted); font-weight: 600; padding: 0 18px 2px; }
  table.ps td { background: var(--soft); padding: 12px 20px; font-size: 17px; line-height: 1.4; vertical-align: middle; }
  table.ps td:first-child { border-radius: 12px 0 0 12px; font-weight: 700; color: var(--navy); width: 36%; }
  table.ps td:last-child { border-radius: 0 12px 12px 0; }
  table.ps td .i { display: inline-block; width: 28px; }
  .arrowcell { width: 30px; color: var(--teal); font-weight: 700; text-align: center; padding: 0 !important; }

  /* 5. results */
  .two { display: grid; grid-template-columns: 1fr 1.2fr; gap: 26px; flex: 1; }
  .kpi { display: flex; gap: 14px; margin-bottom: 18px; }
  .kpi div { flex: 1; background: var(--teal-bg); border-radius: 14px; padding: 16px 18px; }
  .kpi b { display: block; font-size: 28px; white-space: nowrap; color: var(--teal); }
  .kpi span { font-size: 15.5px; color: var(--muted); line-height: 1.35; display: block; margin-top: 4px; }
  .next { counter-reset: n; list-style: none; }
  .next li { counter-increment: n; position: relative; padding: 12px 16px 12px 58px; background: var(--soft); border-radius: 12px; margin-bottom: 12px; font-size: 18px; line-height: 1.5; }
  .next li::before { content: counter(n); position: absolute; left: 16px; top: 12px; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .next li b { color: var(--navy); }
  .closing { margin-top: 18px; background: var(--navy); color: #fff; border-radius: 14px; padding: 18px 26px; font-size: 24px; font-weight: 700; text-align: center; }

  /* 6. presenter notes */
  .notes { background: #fbfaf6; }
  .notes .badge { display: inline-block; background: var(--amber-bg); color: var(--amber); font-weight: 700; font-size: 14px; border-radius: 999px; padding: 4px 12px; margin-bottom: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .card .h { font-size: 15px; font-weight: 700; color: var(--teal); margin-bottom: 6px; }
  .card p { font-size: 16.5px; line-height: 1.5; }
  .card p.say { font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1.25fr; gap: 16px; }
  .card ol, .card ul { padding-left: 20px; } .card li { font-size: 16.5px; line-height: 1.6; margin-bottom: 2px; }
  .card li b { color: var(--navy); }
</style>
</head>
